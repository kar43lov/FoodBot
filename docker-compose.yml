version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-calories-bot
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - APP_URL=${APP_URL}
      - DATABASE_URL=postgresql://foodbot:foodbot@postgres:5432/foodbot?schema=public
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AI_FOOD_CONFIDENCE_THRESHOLD=${AI_FOOD_CONFIDENCE_THRESHOLD:-0.6}
      - MODE=prod
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Europe/Moscow}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodbot-network

  postgres:
    image: postgres:16-alpine
    container_name: food-calories-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=foodbot
      - POSTGRES_PASSWORD=foodbot
      - POSTGRES_DB=foodbot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodbot -d foodbot']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foodbot-network

networks:
  foodbot-network:
    driver: bridge

volumes:
  postgres-data:
